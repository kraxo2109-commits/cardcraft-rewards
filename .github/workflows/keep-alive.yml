name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 14 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" "${{ secrets.SUPABASE_URL }}/rest/v1/businesses?select=id&limit=1"
